// ============================================================================
//  Exhibition kiosk CLIENT config
//  Deployed by start_exhibition.sh into the CS:Source client's cstrike/cfg/
//  and exec'd at launch via:  +exec autoexec_exhibition.cfg
//
//  This is the GAME CLIENT config (the machine a visitor plays on), separate
//  from the dedicated-server config. It is named *_exhibition so it never
//  overwrites your normal autoexec.cfg.
// ============================================================================

// --- Capture-quality netrates (match the 100 Hz server) ---------------------
cl_cmdrate 100
cl_updaterate 100
rate 1000000
fps_max 300

// --- MOTD: force plain-text so the instructions ALWAYS render ----------------
cl_disablehtmlmotd 1

// --- Consistent feel for every visitor --------------------------------------
m_customaccel 0          // no mouse acceleration
cl_autohelp 0
hud_fastswitch 1
cl_showfps 0

// ----------------------------------------------------------------------------
//  AIM-ASSIST CONTROLS  (drive the SM-native in-engine controller only)
// ----------------------------------------------------------------------------

// HOLD V = aim assist ON, release = human baseline.
alias +nativeaim "sm_nativeaim_active 1"
alias -nativeaim "sm_nativeaim_active 0"
bind "v" "+nativeaim"

// Tap F = cycle aim style: raw -> smooth -> humanised -> humanised_high.
// The server-side kiosk plugin owns the cycle and shows the style on screen.
bind "F" "sm_kiosk_cycle"

// --- Optional: also engage on a mouse side button ---------------------------
// If this rig has a MOUSE4/MOUSE5 button you'd rather use, uncomment one:
// bind "MOUSE4" "+nativeaim"
// bind "MOUSE5" "+nativeaim"

echo "[Exhibition] client autoexec loaded:  HOLD V = assist,  F = change style"
