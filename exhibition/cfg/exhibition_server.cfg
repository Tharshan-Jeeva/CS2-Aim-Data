// ============================================================================
//  Exhibition kiosk server config
//  Loaded by start_exhibition.sh via:  +exec exhibition_server.cfg
//
//  ADDITIVE: this file is only exec'd by the exhibition launch script. It does
//  NOT replace server_config/server.cfg and does NOT affect the dissertation
//  recording setup. Nothing here touches the analysis pipeline.
// ============================================================================

hostname "CS:S Aim-Assist Demo  -  walk up and play!"

// --- Network / privacy -------------------------------------------------------
// sv_lan 1 keeps the server off the public master entirely (LAN only), so no
// extra "setmaster" hiding is needed.
sv_lan 1
sv_region 255
sv_pure 0
sv_alltalk 1
sv_password ""           // local single-box client connects freely

// --- Never-ending, unattended match -----------------------------------------
// The kiosk must never sit on a scoreboard / map-vote / intermission while the
// operator is away. Killing every bot must NOT end the round.
mp_timelimit 0                     // no map time limit
mp_maxrounds 0                     // no round limit
mp_winlimit 0                      // no win limit
mp_ignore_round_win_conditions 1   // wiping the bots never ends the round
mp_roundtime 60                    // (irrelevant with ignore_round_win, kept high)
mp_round_restart_delay 1
mp_freezetime 0                    // no buy-time freeze; play immediately
// NOTE: CS:Source has no sv_hibernate_when_empty cvar. An empty server
// hibernates and bots don't spawn until the first client connects. That's fine
// here: start_exhibition.sh auto-connects the game client on boot, which wakes
// the server so the 5 CT bots spawn before any visitor walks up.
mp_autoteambalance 0
mp_limitteams 0
mp_startmoney 16000
mp_buytime 9999
mp_friendlyfire 0
mp_flashlight 1

// --- Bots: the targets to shoot ---------------------------------------------
bot_quota 5
bot_quota_mode normal
bot_difficulty 1            // easy: visitors want to feel the aim assist, not get farmed
bot_join_after_player 0     // bots are present immediately, before anyone joins
bot_join_team CT            // visitors are forced onto T by the kiosk plugin
bot_allow_grenades 0        // no HE / flash / smoke
bot_allow_snipers 0         // no AWP / autosnipers
bot_allow_shotguns 0
bot_allow_machine_guns 0

// --- Aim controllers ---------------------------------------------------------
// NOTE: SourceMod commands (sm_nativeaim_enable, "sm plugins unload ...") are
// NOT set here. This file is exec'd via +exec during engine init, BEFORE
// SourceMod registers its commands, so those would fail with "Unknown command".
// Instead the kiosk plugin (cs_aim_kiosk) handles them in OnConfigsExecuted,
// which runs after SourceMod is fully loaded:
//   * ensures sm_nativeaim_enable 1 (the in-engine aimbot is the only aim path)
//   * unloads cs_aim_telemetry (no recording at the exhibition)
//   * unloads cs_aim_override   (legacy Python-TCP path, never used here)

// Apply everything cleanly.
mp_restartgame 1

echo "[Exhibition] exhibition_server.cfg applied (kiosk mode, no recording)."
